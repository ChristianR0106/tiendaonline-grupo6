AWSTemplateFormatVersion: '2010-09-09'
Description: >
  URPOnline - Conexión segura GitHub Actions -> AWS sin Access Keys (OIDC).
  Crea el proveedor de identidad de GitHub y un rol IAM para tu repositorio.
Parameters:
  GitHubOwner:
    Type: String
    Description: Tu usuario u organización de GitHub (el dueño de TU fork)
  RepoName:
    Type: String
    Default: tiendaonline-grupo6
    Description: Nombre de tu repositorio en GitHub
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "false si tu cuenta ya tiene el proveedor token.actions.githubusercontent.com"
Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, 'true']
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'urponline-github-deploy-${RepoName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOwner}/${RepoName}:*'
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess']
      MaxSessionDuration: 7200
Outputs:
  RoleArn:
    Description: Copia este valor al secreto AWS_ROLE_ARN de tu repositorio en GitHub
    Value: !GetAtt DeployRole.Arn